SPECIFICATION SmokeSpec

CONSTANTS
    Principals = {RoleAdmin, RoleUser}
    Nodes = {NodeA, NodeB, NodeC, NodeD}
    Keyspaces = {KeyspaceA}
    Tables = {TableA}
    Partitions = {PartitionA}
    DataItems = {ItemA, ItemB}
    Mutations = {MutationA, MutationB}
    TokenRanges = {RangeA}
    Epochs = {EpochZero, EpochOne}

    tableKeyspace <- TableKeyspaceCfg
    partitionTable <- PartitionTableCfg
    partitionRange <- PartitionRangeCfg
    rangeKeyspace <- RangeKeyspaceCfg
    itemPartition <- ItemPartitionCfg
    mutationItem <- MutationItemCfg
    mutationTimestamp <- MutationTimestampCfg
    mutationKind <- MutationKindCfg
    ReplicaSets <- ReplicaSetsCfg
    TopologyOperators <- TopologyOperatorsCfg

CONSTRAINT
    SmokeStateBound

INVARIANT
    GlobalTypeInvariant
    AuthSafety
    WritePathSafety
    ReplicaSafety
    ReadSafety
    MigrateSafety
    FrontierSafety
