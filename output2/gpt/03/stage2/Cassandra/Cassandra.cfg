SPECIFICATION CassandraSmokeSpec

CONSTANTS
    Principals = {UserA, UserB}
    Roles = {AdminRole, ClientRole}
    Nodes = {NodeAlpha, NodeBeta, NodeGamma}
    Datacenters = {DatacenterPrimary}
    Keyspaces = {KeyspaceMain}
    Tables = {TableMain}
    Partitions = {PartitionMain}
    PartitionKeys = {PartitionKeyMain}
    Items = {ItemAlpha, ItemBeta}
    Mutations = {MutationOne}
    Tokens = {TokenOne, TokenTwo, TokenThree}
    TokenRanges = {RangeMain}

    principalRole <- CfgPrincipalRole
    loginEnabled <- CfgLoginEnabled
    superuser = {AdminRole, ClientRole}
    roleMembership <- CfgRoleMembership

    tableKeyspace <- CfgTableKeyspace
    partitionTable <- CfgPartitionTable
    partitionKey <- CfgPartitionKey
    partitionToken <- CfgPartitionToken
    rangeOfToken <- CfgRangeOfToken
    rangeKeyspace <- CfgRangeKeyspace
    itemPartition <- CfgItemPartition

    tokenNode <- CfgTokenNode
    nodeDatacenter <- CfgNodeDatacenter

    mutationItem <- CfgMutationItem
    mutationVersion <- CfgMutationVersion
    mutationKind <- CfgMutationKind

    replicationFactor <- CfgReplicationFactor
    initialReplicaSets <- CfgInitialReplicaSets
    InitialPermissionStore <- CfgInitialPermissionStore

CONSTRAINT
    SmokeStateConstraint

INVARIANT
    IntegratedSafety
