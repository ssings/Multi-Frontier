SPECIFICATION Spec

CONSTANTS
    Principals = {Pr1, Pr2}
    Nodes = {Node1, Node2, Node3}
    Keyspaces = {KS1}
    Records = {Rec1, Rec2}
    Partitions = {Part1}
    Replicas = {Rep1, Rep2, Rep3}

    replicaNode <- ReplicaNodeCfg
    replicas <- ReplicasCfg
    recordPartition <- RecordPartitionCfg
    recordKeyspace <- RecordKeyspaceCfg
    partitionKeyspace <- PartitionKeyspaceCfg
    replicationFactor <- ReplicationFactorCfg
    writeConsistencyFactor <- WriteConsistencyFactorCfg
    ReadConsistencyLevels = {"One", "Quorum", "All"}

INVARIANT
    GlobalTypeInvariant
    AuthSafety
    WalBeforeApply
    ReplicaNotAheadOfWAL
    FrontierSafety
    MigrateSafety
